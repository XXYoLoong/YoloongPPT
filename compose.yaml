name: yoloongppt

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    platform: linux/amd64
    init: true
    working_dir: /workspace
    read_only: true
    volumes:
      - .:/workspace:ro
      - ./runtime/data:/runtime
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
